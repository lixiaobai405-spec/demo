services:
  backend:
    build: ./backend
    container_name: meitai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./knowledge:/knowledge
      - backend_data:/app/data
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=sqlite:////app/data/meitai_demo.db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    container_name: meitai-frontend
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - backend

volumes:
  backend_data:
