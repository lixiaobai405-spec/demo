services:
  backend:
    build: ./backend
    container_name: meitai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./knowledge:/app/knowledge:ro
      - backend_data:/app/data
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=sqlite:////app/data/meitai_demo.db
      - CORS_ALLOW_ORIGIN_REGEX=^https?://.*:3001$
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - meitai_network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
    container_name: meitai-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - meitai_network

volumes:
  backend_data:
    driver: local

networks:
  meitai_network:
    driver: bridge
